<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VozPark Admin – Encabezado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0F172A;
    }

    /* ─── HEADER ─────────────────────────────────────────────────────── */
    .vp-header {
      display: flex;
      align-items: center;
      width: 100%;
      height: 55px;
      background: #0F172A;
      border-bottom: 1px solid #1E40AF;
      padding: 0 16px;
      gap: 0;
      position: relative;
      z-index: 100;
    }

    /* ─── BRAND ──────────────────────────────────────────────────────── */
    .vp-brand {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 14px;
      flex-shrink: 0;
    }
    .vp-brand__name {
      font-size: 16px;
      color: #EFF6FF;
      line-height: 1.2;
      white-space: nowrap;
    }
    .vp-brand__sub {
      font-size: 16px;
      color: #2290BF;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* ─── DIVIDER ────────────────────────────────────────────────────── */
    .vp-divider {
      width: 1px;
      height: 40px;
      background: rgba(244, 250, 234, 0.30);
      flex-shrink: 0;
      margin-right: 14px;
    }

    /* ─── BREADCRUMB ─────────────────────────────────────────────────── */
    .vp-breadcrumb {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1;
      min-width: 0;
    }
    .vp-breadcrumb__root {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 16px;
      color: #334155;
      white-space: nowrap;
    }
    .vp-breadcrumb__icon {
      font-size: 18px;
      color: #97C459;
      line-height: 1;
      display: flex;
      align-items: center;
    }
    .vp-breadcrumb__sep {
      font-size: 16px;
      color: #7685B7;
    }
    .vp-breadcrumb__current {
      font-size: 16px;
      color: #AAB0C3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── USER INFO ──────────────────────────────────────────────────── */
    .vp-user {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, rgba(30,64,175,0.70) 0%, rgba(30,64,175,0.10) 100%);
      border: 1px solid #1E40AF;
      border-radius: 6px;
      padding: 4px 10px;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .vp-user__avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1E40AF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #93C5FD;
      flex-shrink: 0;
    }
    .vp-user__info {
      display: flex;
      flex-direction: column;
    }
    .vp-user__name {
      font-size: 16px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.2;
      white-space: nowrap;
    }
    .vp-user__role {
      font-size: 12px;
      color: #EFF6FF;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* ─── LOGOUT BUTTON ──────────────────────────────────────────────── */
    .vp-logout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 55px;
      height: 25px;
      background: transparent;
      border: 1px solid rgba(59, 130, 246, 0.30);
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #1E40AF;
      flex-shrink: 0;
      margin-left: 8px;
      position: relative;
      overflow: hidden;
      transition: background 0.2s, border-color 0.2s;
    }
    .vp-logout:hover {
      background: rgba(59,130,246,0.08);
      border-color: rgba(59,130,246,0.55);
    }
    .vp-logout:active { background: rgba(59,130,246,0.18); }
    .vp-logout svg { width: 16px; height: 16px; color: #1E40AF; flex-shrink: 0; }

    /* ripple */
    .vp-logout .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(59,130,246,0.30);
      transform: scale(0);
      animation: ripple-anim 0.55s linear;
      pointer-events: none;
    }
    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }

    /* ─── MODAL OVERLAY ──────────────────────────────────────────────── */
    .vp-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .vp-modal-overlay.active { display: flex; }

    .vp-modal {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 28px 32px 24px;
      width: 340px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .vp-modal__title {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      line-height: 1.4;
    }
    .vp-modal__actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .vp-modal__btn {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      color: #FFFFFF;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: filter 0.2s;
    }
    .vp-modal__btn:hover { filter: brightness(1.12); }
    .vp-modal__btn:active { filter: brightness(0.90); }
    .vp-modal__btn--cancel  { background: #3B82F6; }
    .vp-modal__btn--confirm { background: #1E40AF; }

    /* ─── RESPONSIVE ─────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .vp-brand__sub { display: none; }
      .vp-user__role { display: none; }
      .vp-breadcrumb__current { max-width: 100px; }
      .vp-logout span { display: none; }
      .vp-logout { width: 34px; }
    }
    @media (max-width: 400px) {
      .vp-breadcrumb { display: none; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════ HEADER ═══════════════════════════════ -->
<header class="vp-header">

  <!-- Brand -->
  <div class="vp-brand">
    <span class="vp-brand__name">VozPark Admin</span>
    <span class="vp-brand__sub">Portal Municipal</span>
  </div>

  <!-- Vertical divider -->
  <div class="vp-divider"></div>

  <!-- Breadcrumb -->
  <nav class="vp-breadcrumb" aria-label="Navegación">
    <span class="vp-breadcrumb__root">
      <!-- Home icon -->
      <span class="vp-breadcrumb__icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="#97C459" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 21 9 12 15 12 15 21"/>
        </svg>
      </span>
      Admin
    </span>
    <span class="vp-breadcrumb__sep">›</span>
    <span class="vp-breadcrumb__current" id="breadcrumb-current">Gestión de Incidencias</span>
  </nav>

  <!-- User info -->
  <div class="vp-user">
    <div class="vp-user__avatar" aria-hidden="true">CA</div>
    <div class="vp-user__info">
      <span class="vp-user__name">Carlos Amaya</span>
      <span class="vp-user__role">Administrador · Alcaldía SS</span>
    </div>
  </div>

  <!-- Logout button -->
  <button class="vp-logout" id="btn-logout" aria-label="Cerrar sesión">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    <span>Salir</span>
  </button>

</header>

<!-- ═══════════════════════════════ MODAL ════════════════════════════════ -->
<div class="vp-modal-overlay" id="logout-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="vp-modal">
    <p class="vp-modal__title" id="modal-title">¿Estás seguro de cerrar sesión?</p>
    <div class="vp-modal__actions">
      <button class="vp-modal__btn vp-modal__btn--cancel"  id="btn-cancel">Cancelar</button>
      <button class="vp-modal__btn vp-modal__btn--confirm" id="btn-confirm">Confirmar</button>
    </div>
  </div>
</div>

<script>
  /* ── Breadcrumb dinámico ───────────────────────────────── */
  const sections = {
    'gestion-incidencias' : 'Gestión de Incidencias',
    'detalle-incidencia'  : 'Detalle de Incidencia',
    'dashboard'           : 'Dashboard',
  };

  function setBreadcrumb(sectionKey) {
    const el = document.getElementById('breadcrumb-current');
    if (el && sections[sectionKey]) el.textContent = sections[sectionKey];
  }

  // Demo: leer de query param  ?section=detalle-incidencia
  const params = new URLSearchParams(window.location.search);
  if (params.get('section')) setBreadcrumb(params.get('section'));

  // Expose globally so other pages can call setBreadcrumb('key')
  window.setBreadcrumb = setBreadcrumb;

  /* ── Logout modal ─────────────────────────────────────── */
  const modal    = document.getElementById('logout-modal');
  const btnOut   = document.getElementById('btn-logout');
  const btnCancel  = document.getElementById('btn-cancel');
  const btnConfirm = document.getElementById('btn-confirm');

  btnOut.addEventListener('click', () => {
    createRipple(btnOut, event);
    modal.classList.add('active');
  });

  btnCancel.addEventListener('click', () => modal.classList.remove('active'));

  btnConfirm.addEventListener('click', () => {
    modal.classList.remove('active');
    // Redirigir al login
    window.location.href = 'login.html';
  });

  // Cerrar modal al clic en overlay
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('active');
  });

  // ESC cierra el modal
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') modal.classList.remove('active');
  });

  /* ── Ripple effect ───────────────────────────────────── */
  function createRipple(btn, e) {
    const rect   = btn.getBoundingClientRect();
    const size   = Math.max(rect.width, rect.height);
    const x      = (e.clientX - rect.left) - size / 2;
    const y      = (e.clientY - rect.top)  - size / 2;
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
    btn.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  document.querySelectorAll('.vp-modal__btn, .vp-logout').forEach(btn => {
    btn.addEventListener('click', (e) => createRipple(btn, e));
  });
</script>
<script src="sidebar.js"></script>
</body>
</html>
