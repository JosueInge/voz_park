<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VozPark Admin – Reportes Estratégicos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F9FCFF; min-height: 100vh; }

    /* ══ HEADER ══ */
    .vp-header { display:flex; align-items:center; width:100%; height:55px; background:#0F172A; border-bottom:1px solid #1E40AF; padding:0 16px; position:sticky; top:0; z-index:100; }
    .vp-brand  { display:flex; flex-direction:column; padding-right:14px; flex-shrink:0; }
    .vp-brand__name { font-size:16px; font-weight:600; color:#EFF6FF; line-height:1.2; }
    .vp-brand__sub  { font-size:16px; color:#2290BF; line-height:1.2; }
    .vp-hdr-div { width:1px; height:40px; background:rgba(244,250,234,.30); flex-shrink:0; margin-right:14px; }
    .vp-breadcrumb { display:flex; align-items:center; gap:5px; flex:1; }
    .vp-breadcrumb__root { display:flex; align-items:center; gap:5px; font-size:16px; color:#334155; }
    .vp-breadcrumb__root svg { width:18px; height:18px; color:#97C459; }
    .vp-breadcrumb__sep  { font-size:16px; color:#7685B7; }
    .vp-breadcrumb__cur  { font-size:16px; color:#AAB0C3; }
    .vp-user { display:flex; align-items:center; gap:8px; background:linear-gradient(90deg,rgba(30,64,175,.70),rgba(30,64,175,.10)); border:1px solid #1E40AF; border-radius:6px; padding:4px 10px; margin-left:12px; flex-shrink:0; }
    .vp-user__av   { width:32px; height:32px; border-radius:50%; background:#1E40AF; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#93C5FD; }
    .vp-user__name { font-size:16px; font-weight:600; color:#FFFFFF; white-space:nowrap; }
    .vp-user__role { font-size:12px; color:#EFF6FF; white-space:nowrap; }
    .vp-logout { display:flex; align-items:center; justify-content:center; gap:5px; width:55px; height:25px; background:transparent; border:1px solid rgba(59,130,246,.30); border-radius:4px; cursor:pointer; font-family:'Inter',sans-serif; font-size:14px; color:#1E40AF; margin-left:8px; position:relative; overflow:hidden; transition:background .2s; }
    .vp-logout:hover { background:rgba(59,130,246,.08); }
    .vp-logout svg { width:16px; height:16px; }

    /* Ripple */
    .ripple { position:absolute; border-radius:50%; background:rgba(59,130,246,.25); transform:scale(0); animation:rpl .55s linear; pointer-events:none; }
    @keyframes rpl { to { transform:scale(4); opacity:0; } }

    /* Modal logout */
    .vp-modal-ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:999; align-items:center; justify-content:center; }
    .vp-modal-ov.active { display:flex; }
    .vp-modal { background:#1E293B; border:1px solid #334155; border-radius:10px; padding:28px 32px 24px; width:340px; max-width:90vw; display:flex; flex-direction:column; gap:20px; }
    .vp-modal__title { font-size:16px; font-weight:700; color:#FFFFFF; text-align:center; }
    .vp-modal__actions { display:flex; gap:12px; }
    .vp-modal__btn { flex:1; height:40px; border:none; border-radius:8px; font-family:'Inter',sans-serif; font-size:16px; color:#FFFFFF; cursor:pointer; position:relative; overflow:hidden; transition:filter .2s; }
    .vp-modal__btn--cancel  { background:#3B82F6; }
    .vp-modal__btn--confirm { background:#1E40AF; }
    .vp-modal__btn:hover { filter:brightness(1.12); }

    /* ══ MAIN ══ */
    .vp-main { padding:24px 24px 56px; max-width:1200px; margin:0 auto; }

    /* Top row */
    .vp-top-row { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
    .vp-page-title { font-size:24px; font-weight:700; color:#0F172A; }
    .vp-page-sub   { font-size:14px; color:#557097; margin-top:3px; }

    /* Export buttons */
    .vp-export-btns { display:flex; gap:10px; flex-wrap:wrap; }
    .vp-btn-export {
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      height:32px; padding:0 16px;
      border-radius:4px; font-family:'Inter',sans-serif; font-size:14px;
      cursor:pointer; position:relative; overflow:hidden; transition:filter .2s, box-shadow .2s;
      text-decoration:none; border:none;
    }
    .vp-btn-export:hover { filter:brightness(1.10); box-shadow:0 3px 10px rgba(0,0,0,.15); }
    .vp-btn-export svg { width:14px; height:14px; }
    .vp-btn-export--pdf   { background:#E53E3E; color:#FFFFFF; }
    .vp-btn-export--excel { background:#276749; color:#FFFFFF; }

    /* ══ METRIC CARDS ══ */
    .vp-metrics { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
    .vp-card {
      flex:1; min-width:160px; background:#FFFFFF;
      border:1px solid rgba(118,133,183,.30); border-radius:8px;
      padding:14px 16px; display:flex; flex-direction:column; gap:6px;
    }
    .vp-card__label  { font-size:13px; color:#557097; }
    .vp-card__number { font-size:28px; font-weight:700; color:#0F172A; line-height:1.1; }
    .vp-card__sub    { font-size:13px; color:#3B6D11; }

    /* ══ TWO COLUMN LAYOUT ══ */
    .vp-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }

    /* ══ SECTION BOX ══ */
    .vp-section {
      background:#FFFFFF; border:1px solid rgba(118,133,183,.30);
      border-radius:8px; padding:18px 20px;
    }
    .vp-section__title { font-size:16px; font-weight:600; color:#0F172A; margin-bottom:16px; }

    /* Barras por tipo */
    .vp-bar-item { margin-bottom:12px; }
    .vp-bar-item__label { display:flex; justify-content:space-between; font-size:14px; color:#334155; margin-bottom:4px; }
    .vp-bar-track { background:#F1F5F9; border-radius:4px; height:10px; overflow:hidden; }
    .vp-bar-fill  { height:100%; border-radius:4px; background:linear-gradient(90deg,#1E40AF,#2290BF); transition:width .8s ease; }

    /* Tabla ranking parques */
    .vp-rank-table { width:100%; border-collapse:collapse; }
    .vp-rank-table thead th {
      font-size:13px; font-weight:600; color:#0F172A;
      padding:8px 12px; text-align:left; border-bottom:2px solid #97C459;
    }
    .vp-rank-table tbody tr { border-bottom:1px solid #F1F5F9; transition:background .15s; }
    .vp-rank-table tbody tr:hover { background:#F8FAFC; }
    .vp-rank-table tbody td { font-size:14px; color:#334155; padding:8px 12px; }
    .vp-rank-num { font-weight:700; color:#1E40AF; }

    /* Estado vacío */
    .vp-empty { text-align:center; padding:48px 0; font-size:16px; color:#557097; }

    /* Loader */
    .vp-loading { display:flex; align-items:center; justify-content:center; gap:10px; padding:60px 0; color:#557097; font-size:16px; }
    .vp-spinner { width:24px; height:24px; border:3px solid #E2E8F0; border-top-color:#1E40AF; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ══ RESPONSIVE ══ */
    @media (max-width:768px) {
      .vp-grid-2 { grid-template-columns:1fr; }
      .vp-metrics .vp-card { min-width:calc(50% - 8px); }
      .vp-user__role { display:none; }
    }
    @media (max-width:480px) {
      .vp-brand__sub { display:none; }
      .vp-metrics .vp-card { min-width:100%; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="vp-header">
  <div class="vp-brand">
    <span class="vp-brand__name">VozPark Admin</span>
    <span class="vp-brand__sub">Portal Municipal</span>
  </div>
  <div class="vp-hdr-div"></div>
  <nav class="vp-breadcrumb">
    <span class="vp-breadcrumb__root">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
      Admin
    </span>
    <span class="vp-breadcrumb__sep">›</span>
    <span class="vp-breadcrumb__cur">Reportes Estratégicos</span>
  </nav>
  <div class="vp-user">
    <div class="vp-user__av" id="hdr-av">CA</div>
    <div>
      <div class="vp-user__name" id="hdr-nombre">Carlos Amaya</div>
      <div class="vp-user__role">Administrador · Alcaldía SS</div>
    </div>
  </div>
  <button class="vp-logout" id="btn-logout">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Salir
  </button>
</header>

<!-- Modal logout -->
<div class="vp-modal-ov" id="logout-modal">
  <div class="vp-modal">
    <p class="vp-modal__title">¿Estás seguro de cerrar sesión?</p>
    <div class="vp-modal__actions">
      <button class="vp-modal__btn vp-modal__btn--cancel"  id="btn-cancel">Cancelar</button>
      <button class="vp-modal__btn vp-modal__btn--confirm" id="btn-confirm">Confirmar</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<main class="vp-main">

  <!-- Top row -->
  <div class="vp-top-row">
    <div>
      <h1 class="vp-page-title">Reportes estratégicos</h1>
      <p class="vp-page-sub" id="mes-label">Cargando datos del mes...</p>
    </div>
    <div class="vp-export-btns">
      <button class="vp-btn-export vp-btn-export--pdf" id="btn-pdf">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Exportar PDF
      </button>
      <button class="vp-btn-export vp-btn-export--excel" id="btn-excel">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        Exportar Excel
      </button>
    </div>
  </div>

  <!-- Contenido dinámico -->
  <div id="content">
    <div class="vp-loading"><div class="vp-spinner"></div> Cargando reportes estratégicos...</div>
  </div>

</main>

<script>
const API   = '../backend';
const TOKEN = localStorage.getItem('vp_token') ?? '';

/* ── Cargar datos ── */
async function cargarDatos() {
  try {
    const res  = await fetch(`${API}/admin/reportes-estrategicos`, {
      headers: { 'Authorization': `Bearer ${TOKEN}` }
    });
    if (res.status === 401) { window.location.href = '../login.php'; return; }

    const json = await res.json();
    if (!json.success) { mostrarVacio(json.message); return; }

    renderizar(json.data);
  } catch {
    document.getElementById('content').innerHTML =
      '<div class="vp-empty">Error al conectar con el servidor.</div>';
  }
}

/* ── Renderizar ── */
function renderizar(d) {
  document.getElementById('mes-label').textContent = 'Mes actual: ' + d.mes;

  const html = `
    <!-- Métricas -->
    <div class="vp-metrics">
      <div class="vp-card">
        <span class="vp-card__label">Total de reportes</span>
        <span class="vp-card__number">${d.total_reportes_mes}</span>
        <span class="vp-card__sub">este mes</span>
      </div>
      <div class="vp-card">
        <span class="vp-card__label">Tasa de resolución</span>
        <span class="vp-card__number">${d.tasa_resolucion}%</span>
        <span class="vp-card__sub">reportes cerrados</span>
      </div>
      <div class="vp-card">
        <span class="vp-card__label">Uso de parques</span>
        <span class="vp-card__number">${d.pct_uso_parques}%</span>
        <span class="vp-card__sub">con incidencias activas</span>
      </div>
      <div class="vp-card">
        <span class="vp-card__label">Tiempo promedio</span>
        <span class="vp-card__number">${d.pct_tiempo_respuesta}h</span>
        <span class="vp-card__sub">de respuesta</span>
      </div>
    </div>

    <!-- Grid 2 col -->
    <div class="vp-grid-2">

      <!-- Por tipo -->
      <div class="vp-section">
        <div class="vp-section__title">Incidencias por tipo</div>
        ${d.incidencias_por_tipo.length
          ? d.incidencias_por_tipo.map(t => `
            <div class="vp-bar-item">
              <div class="vp-bar-item__label">
                <span>${t.tipo}</span>
                <span>${t.total} (${t.porcentaje}%)</span>
              </div>
              <div class="vp-bar-track">
                <div class="vp-bar-fill" style="width:${t.porcentaje}%"></div>
              </div>
            </div>`).join('')
          : '<div class="vp-empty" style="padding:20px 0">Sin datos</div>'
        }
      </div>

      <!-- Top mayor -->
      <div class="vp-section">
        <div class="vp-section__title">Top 5 parques con más incidencias</div>
        ${rankTable(d.top_mayor_incidencias)}
      </div>

    </div>

    <!-- Top menor -->
    <div class="vp-section">
      <div class="vp-section__title">Top 5 parques con menos incidencias</div>
      ${rankTable(d.top_menor_incidencias)}
    </div>
  `;

  document.getElementById('content').innerHTML = html;
}

function rankTable(lista) {
  if (!lista.length) return '<div class="vp-empty" style="padding:20px 0">Sin datos</div>';
  return `
    <table class="vp-rank-table">
      <thead><tr><th>#</th><th>Parque</th><th>Total</th></tr></thead>
      <tbody>
        ${lista.map((p, i) => `
          <tr>
            <td class="vp-rank-num">${i + 1}</td>
            <td>${p.parque}</td>
            <td>${p.total}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function mostrarVacio(msg) {
  document.getElementById('content').innerHTML =
    `<div class="vp-empty">${msg ?? 'No hay datos disponibles para este mes'}</div>`;
}

/* ── Exportar ── */
function exportar(tipo) {
  const url = `${API}/admin/reportes-estrategicos/exportar-${tipo}`;
  const a   = document.createElement('a');
  a.href = url;
  a.setAttribute('download', '');
  // Pasar token via URL solo para descarga directa
  a.href = url + '?token=' + encodeURIComponent(TOKEN);
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.getElementById('btn-pdf').addEventListener('click', e => {
  crearRipple(e.currentTarget, e); exportar('pdf');
});
document.getElementById('btn-excel').addEventListener('click', e => {
  crearRipple(e.currentTarget, e); exportar('excel');
});

/* ── Logout ── */
document.getElementById('btn-logout').addEventListener('click', e => {
  crearRipple(e.currentTarget, e);
  document.getElementById('logout-modal').classList.add('active');
});
document.getElementById('btn-cancel').addEventListener('click',  () =>
  document.getElementById('logout-modal').classList.remove('active'));
document.getElementById('btn-confirm').addEventListener('click', () => {
  localStorage.removeItem('vp_token');
  window.location.href = '../login/login.php';
});
document.getElementById('logout-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('logout-modal'))
    document.getElementById('logout-modal').classList.remove('active');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('logout-modal').classList.remove('active');
});

/* ── Ripple ── */
function crearRipple(btn, e) {
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const r    = document.createElement('span');
  r.className = 'ripple';
  r.style.cssText = `width:${size}px;height:${size}px;`
                  + `left:${e.clientX-rect.left-size/2}px;`
                  + `top:${e.clientY-rect.top-size/2}px`;
  btn.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
}
document.querySelectorAll('.vp-modal__btn, .vp-logout').forEach(b =>
  b.addEventListener('click', e => crearRipple(b, e)));

/* ── Init ── */
cargarDatos();
</script>
<script src="sidebar.js"></script>
</body>
</html>
